<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0c" />
  <meta name="description" content="QuestFlow helps teams run projects, tasks and expense claims, and rewards finished work with XP, levels and a team leaderboard." />

  <meta property="og:title" content="QuestFlow" />
  <meta property="og:description" content="Run projects, approve expenses and level up your team with XP." />
  <meta property="og:type" content="website" />

  <title>QuestFlow</title>

  <!-- Apply the saved theme before first paint so there is no light/dark flash. -->
  <script>
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f3f1");
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
